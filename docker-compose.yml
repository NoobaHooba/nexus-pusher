version: '3.8'
services:

  # Serves the built React SPA on the compose default network.
  frontend:
    build: ./frontend
    ports:
      - '5173:80'

  # Reverse proxy to Nexus — mirrors the manual docker run command:
  # docker run -d --name nexus-proxy --network nexus-net -p 8080:80 \
  #   -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
  # In the app Settings, set Nexus URL to: http://localhost:8080
  proxy:
    image: nginx:alpine
    container_name: nexus-proxy
    ports:
      - '8080:80'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nexus-net

networks:
  nexus-net:
    external: true
