version: '3.8'
services:
  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    # No backend needed — the app calls Nexus directly from the browser.
    # Make sure CORS is enabled in Nexus:
    #   Admin UI → System → Capabilities → add "CORS" capability
    #   and set the allowed origin to the frontend URL (or * for local use).
