version: '3.8'
services:

  # Serves the built React SPA
  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - proxy

  # CORS + reverse proxy: browser calls this, it forwards to Nexus
  # In Settings, set Nexus URL to: http://localhost:8888
  proxy:
    image: nginx:alpine
    ports:
      - '8888:80'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Assumes Nexus is reachable on the Docker network as 'nexus'.
    # If Nexus is running outside this compose file, replace 'nexus'
    # with the actual hostname/IP and update proxy_pass in proxy/nginx.conf.
    extra_hosts:
      - 'nexus:host-gateway'
