version: '3.8'
services:

  # Serves the built React SPA on the compose default network.
  frontend:
    build: ./frontend
    ports:
      - '5173:80'

  # Reverse proxy to Nexus. This container joins the external nexus-net
  # network so it can reach the existing Nexus container directly.
  # In the app Settings, set Nexus URL to: http://localhost:8888
  proxy:
    image: nginx:alpine
    container_name: nexus-proxy
    ports:
      - '8888:80'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - nexus-net

networks:
  nexus-net:
    external: true
