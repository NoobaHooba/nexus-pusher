version: '3.8'
services:

  # Serves the built React SPA.
  frontend:
    build: ./frontend
    ports:
      - '5173:80'

  # Reverse proxy to Nexus.
  # Port 8080 → uploads (credentialed CORS, browser may cache auth session).
  # Port 8082 → validation-only (no Allow-Credentials, browser never caches
  #              auth for this origin, so wrong creds reliably return 401).
  # In the app Settings, set Nexus URL to: http://localhost:8080
  proxy:
    image: nginx:alpine
    container_name: nexus-proxy
    ports:
      - '8080:80'
      - '8082:8082'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nexus-net

networks:
  nexus-net:
    external: true
