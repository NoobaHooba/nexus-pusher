services:

  frontend:
    build: ./frontend
    ports:
      - '5173:8080'
    networks:
      - nexus-net

  nexus-backend:
    build: ./backend
    container_name: nexus-backend
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      - NEXUS_URL=http://nexus:8081
      - NEXUS_BROWSER_URL=http://localhost:8081
    volumes:
      - nexus-pusher-data:/app/data
    networks:
      - nexus-net

networks:
  nexus-net:
    external: true

volumes:
  nexus-pusher-data:
