version: '3.8'
services:

  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    networks:
      - nexus-net

  backend:
    build: ./backend
    container_name: nexus-backend
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
    volumes:
      - nexus-pusher-data:/app/data
    networks:
      - nexus-net

networks:
  nexus-net:
    external: true

volumes:
  nexus-pusher-data:
