version: '3.8'
services:

  # Serves the built React SPA on the compose default network.
  frontend:
    build: ./frontend
    ports:
      - '5173:80'

  # Node.js backend — validates credentials server-side (bypasses browser
  # Basic Auth cache) and handles uploads.
  backend:
    build: ./backend
    ports:
      - '3001:3001'
    networks:
      - nexus-net

  # Reverse proxy to Nexus.
  # In the app Settings, set Nexus URL to: http://localhost:8080
  proxy:
    image: nginx:alpine
    container_name: nexus-proxy
    ports:
      - '8080:80'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nexus-net

networks:
  nexus-net:
    external: true
