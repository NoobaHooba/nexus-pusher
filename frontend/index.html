<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary title — overridden dynamically by useDocumentTitle hook -->
    <title>Nexus Pusher</title>

    <!-- SEO / social -->
    <meta name="description" content="Push repository builds, container images, and binary artifacts to Nexus Repository Manager." />
    <meta name="theme-color" content="#01696f" />

    <!-- Open Graph -->
    <meta property="og:title" content="Nexus Pusher" />
    <meta property="og:description" content="Artifact upload dashboard for Nexus Repository Manager." />
    <meta property="og:type" content="website" />

    <!--

    <!-- PNG fallback for browsers that don’t support SVG favicons (IE, older Safari) -->

    <!-- Apple touch icon -->

    <!-- Fonts are bundled via npm imports so the UI works in air-gapped environments. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
