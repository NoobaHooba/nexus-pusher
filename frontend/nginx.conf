server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api calls to the Express backend container.
    # 'backend' resolves via Docker's internal DNS on nexus-net.
    location /api {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Large uploads — no buffering, generous timeouts
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_connect_timeout   10s;
        proxy_send_timeout      600s;
        proxy_read_timeout      600s;

        client_max_body_size 1G;
    }

    # React SPA — all other paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
