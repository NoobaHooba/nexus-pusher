server {
    listen 80;
    server_name _;

    client_max_body_size 1G;

    location / {
        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Vary                             "Origin" always;
            return 204;
        }

        # CORS headers on real requests
        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
        add_header Vary                             "Origin" always;

        proxy_pass http://nexus:8081;

        # Send the upstream host to Nexus so its auth realm matches.
        proxy_set_header Host               $proxy_host;

        # Forward the browser's Authorization header to Nexus.
        # proxy_pass_header only affects *response* headers — it does NOT
        # forward request headers. proxy_set_header is required here.
        proxy_set_header Authorization      $http_authorization;

        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        proxy_read_timeout      300s;
    }
}
