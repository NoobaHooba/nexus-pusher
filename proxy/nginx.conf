# ── Upload proxy (port 80 → exposed as 8080) ─────────────────────────────────
# Auth strategy: frontend sends credentials as ?_auth=Basic%20<base64> query
# param. Nginx reads $arg__auth and sets it as the Authorization header.
# Query params are never subject to browser Basic Auth cache rules or CORS
# custom-header restrictions. Nexus never sees the _auth param (it's only
# used by Nginx to set the header).
server {
    listen 80;
    server_name _;

    client_max_body_size 1G;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        # Strip _auth from the upstream URL so Nexus never sees it
        set $clean_uri $request_uri;
        if ($request_uri ~ ^(.*)[?&]_auth=[^&]*(.*)) {
            set $clean_uri $1$2;
        }
        # Clean up any trailing ? or & left over
        if ($clean_uri ~ ^(.*)[?&]$) {
            set $clean_uri $1;
        }

        proxy_pass http://nexus:8081$clean_uri;

        proxy_set_header Host               $proxy_host;
        proxy_set_header Authorization      $arg__auth;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        proxy_read_timeout      300s;
    }
}

# ── Validation-only proxy (port 8082) ─────────────────────────────────────────
# Used by SettingsModal to test credentials (GET only).
# Also uses ?_auth= param for consistency.
server {
    listen 8082;
    server_name _;

    client_max_body_size 1k;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age       60 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        set $clean_uri $request_uri;
        if ($request_uri ~ ^(.*)[?&]_auth=[^&]*(.*)) {
            set $clean_uri $1$2;
        }
        if ($clean_uri ~ ^(.*)[?&]$) {
            set $clean_uri $1;
        }

        proxy_pass http://nexus:8081$clean_uri;

        proxy_set_header Host               $proxy_host;
        proxy_set_header Authorization      $arg__auth;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_connect_timeout   10s;
        proxy_read_timeout      30s;
    }
}
