# ── Upload proxy (port 80 → exposed as 8080) ─────────────────────────────────
# Used for actual artifact uploads from the browser.
# withCredentials=true is required here for the credentialed CORS multipart
# POST. The browser will cache the Basic Auth session for this origin.
server {
    listen 80;
    server_name _;

    client_max_body_size 1G;

    location / {
        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Vary                             "Origin" always;
            return 204;
        }

        # CORS headers on real requests
        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
        add_header Vary                             "Origin" always;

        proxy_pass http://nexus:8081;

        proxy_set_header Host               $proxy_host;
        proxy_set_header Authorization      $http_authorization;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        proxy_read_timeout      300s;
    }
}

# ── Validation-only proxy (port 8082) ─────────────────────────────────────────
# Used exclusively by SettingsModal to test credentials on Save.
# Key difference: NO Access-Control-Allow-Credentials header.
# Without it the browser never caches a Basic Auth session for this origin
# (localhost:8082), so the Authorization header set by the app is always
# the only one Nexus sees — wrong creds reliably return 401.
server {
    listen 8082;
    server_name _;

    client_max_body_size 1k;

    location / {
        # CORS preflight (no Allow-Credentials)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age       60 always;
            add_header Vary                         "Origin" always;
            return 204;
        }

        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Vary                         "Origin" always;

        proxy_pass http://nexus:8081;

        proxy_set_header Host               $proxy_host;
        proxy_set_header Authorization      $http_authorization;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_connect_timeout   10s;
        proxy_read_timeout      30s;
    }
}
