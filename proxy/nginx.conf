# ── Upload proxy (port 80 → exposed as 8080) ─────────────────────────────────
# The frontend sends credentials in X-Nexus-Auth (a pre-built Basic token)
# instead of Authorization. Nginx strips the browser's own Authorization
# header and replaces it with the value from X-Nexus-Auth. This completely
# bypasses Firefox's cached Basic Auth session.
server {
    listen 80;
    server_name _;

    client_max_body_size 1G;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, X-Nexus-Auth, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, X-Nexus-Auth, Content-Type, X-Requested-With" always;

        proxy_pass http://nexus:8081;

        proxy_set_header Host               $proxy_host;

        # Strip whatever the browser puts in Authorization (cached session)
        # and replace it with the value the frontend put in X-Nexus-Auth.
        proxy_set_header Authorization      $http_x_nexus_auth;

        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        proxy_read_timeout      300s;
    }
}

# ── Validation-only proxy (port 8082) ─────────────────────────────────────────
# Same X-Nexus-Auth approach for consistency.
server {
    listen 8082;
    server_name _;

    client_max_body_size 1k;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, X-Nexus-Auth, Content-Type" always;
            add_header Access-Control-Max-Age       60 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, X-Nexus-Auth, Content-Type" always;

        proxy_pass http://nexus:8081;

        proxy_set_header Host               $proxy_host;
        proxy_set_header Authorization      $http_x_nexus_auth;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_connect_timeout   10s;
        proxy_read_timeout      30s;
    }
}
