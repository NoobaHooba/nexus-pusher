# Auth strategy:
# Frontend sends a real 'Authorization: Basic <base64>' HTTP header.
# Nginx passes it straight through to Nexus via $http_authorization.
# CORS preflight allows the Authorization header, so browsers send it fine.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nexus_upstream http://nexus:8081;

    client_max_body_size 1G;

    location / {
        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      "*" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age           86400 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin      "*" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Expose-Headers    "*" always;

        proxy_pass $nexus_upstream$request_uri;

        proxy_set_header Host               $proxy_host;
        proxy_set_header Authorization      $http_authorization;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        proxy_read_timeout      300s;
    }
}
