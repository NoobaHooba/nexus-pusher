# Auth strategy:
# Frontend sends ?_t=<base64(user:pass)> (no 'Basic ' prefix, no space).
# Nginx prepends 'Basic ' and sets the Authorization header.
# base64 chars (A-Za-z0-9+/=) never get percent-encoded by browsers.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nexus_upstream http://nexus:8081;

    client_max_body_size 1G;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        # Strip _t param from upstream URL
        set $clean_uri $request_uri;
        if ($request_uri ~ "^(.*)[?&]_t=[^&]*(.*)$") {
            set $clean_uri $1$2;
        }
        if ($clean_uri ~ "^(.*)[?&]$") {
            set $clean_uri $1;
        }

        proxy_pass $nexus_upstream$clean_uri;

        proxy_set_header Host               $proxy_host;
        # Nginx prepends 'Basic ' — $arg__t is the raw base64 token, no space needed
        proxy_set_header Authorization      "Basic $arg__t";
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        proxy_read_timeout      300s;
    }
}

server {
    listen 8082;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nexus_upstream http://nexus:8081;

    client_max_body_size 1k;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age       60 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        set $clean_uri $request_uri;
        if ($request_uri ~ "^(.*)[?&]_t=[^&]*(.*)$") {
            set $clean_uri $1$2;
        }
        if ($clean_uri ~ "^(.*)[?&]$") {
            set $clean_uri $1;
        }

        proxy_pass $nexus_upstream$clean_uri;

        proxy_set_header Host               $proxy_host;
        proxy_set_header Authorization      "Basic $arg__t";
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_connect_timeout   10s;
        proxy_read_timeout      30s;
    }
}
