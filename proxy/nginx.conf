server {
    listen 80;
    server_name _;

    client_max_body_size 1G;

    # Handle CORS preflight
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods  "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers  "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age        86400 always;
            add_header Vary                          "Origin" always;
            return 204;
        }

        # CORS headers on every real request
        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
        add_header Vary                             "Origin" always;

        proxy_pass http://nexus:8081;

        # Use the upstream host (nexus:8081), NOT the browser's Host header.
        # Nexus uses the Host header for its auth realm — sending the browser
        # origin (localhost:5173) causes Nexus to reject credentials with 401.
        proxy_set_header Host               $proxy_host;

        # Forward the browser's Authorization header to Nexus unchanged.
        # Without this nginx may drop it.
        proxy_pass_header Authorization;

        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Do not alter the response body (important for large binary uploads)
        proxy_buffering             off;
        proxy_request_buffering     off;

        proxy_connect_timeout       10s;
        proxy_send_timeout          120s;
        proxy_read_timeout          300s;
    }
}
